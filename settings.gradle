plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NoChatReports'

include 'plugin'
include 'nms'
include 'nms:common'

// One module per supported Minecraft version (see nms/build.gradle)
file('nms').eachDirMatch(~/v\d.*/) { include "nms:${it.name}" }
