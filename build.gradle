plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
    // Applied per version in nms/build.gradle; declared once here so every module shares one copy
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' apply false
}

allprojects {
    group = 'com.tcoded'
    version = '2.7.8'

    repositories {
        mavenCentral()

        maven {
            name = "codemc-releases"
            url = "https://repo.codemc.io/repository/maven-releases/"
        }

        maven {
            name = "codemc-snapshots"
            url = "https://repo.codemc.io/repository/maven-snapshots/"
        }

        maven {
            name = "spigotmc-repo"
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
        }

        maven { url 'https://jitpack.io' }

        maven { url 'https://repo.papermc.io/repository/maven-public' }

        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }

        maven {
            name = "problems"
            url = "https://repo.viaversion.com"
        }
    }
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'com.gradleup.shadow'

    group = rootProject.group + '.nochatreports'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    jar {
        manifest {}
    }

//    shadowJar {
//        minimize() {
//            logger.log(LogLevel.ERROR, "Minimizing ${project.name}")
//            exclude project(':nms')
//            exclude "META-INF", "META-INF/**"
//        }
//    }

    test {
        useJUnitPlatform()
    }

}

tasks.assemble {
    dependsOn shadowJar
}

dependencies {
    implementation project(":plugin")
    implementation project(":nms:common")
    rootProject.findProject(':nms').subprojects.findAll { it.name ==~ /v\d.*/ }.each {
        implementation project(path: it.path, configuration: 'nmsJar')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveClassifier.set("raw")
}

shadowJar {
    archiveClassifier.set("")

    // PacketEvents
    relocate 'com.github.retrooper.packetevents', "${project.group}.nochatreports.lib.packetevents.api"
    relocate 'io.github.retrooper.packetevents', "${project.group}.nochatreports.lib.packetevents.impl"
    relocate 'net.kyori', "${project.group}.nochatreports.lib.packetevents.kyori"

    // SpigotUpdateChecker
    relocate 'com.tcoded.lightlibs.updatechecker', "${project.group}.nochatreports.lib.spigotupdatechecker"

    // FoliaLib
    relocate "com.tcoded.folialib", "com.tcoded.nochatreports.plugin.lib.folialib"
}